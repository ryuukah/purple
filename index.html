<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CD Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="player">

    <div class="player-content">

      <button
        class="album-button"
        id="albumButton"
        aria-label="Play or stop music"
      >

        <img
          class="cover"
          src="image.jpg"
          alt="Album artwork"
        >

        <div class="cd" id="cd">
          <div class="cd-shine"></div>

          <div class="cd-ring ring-1"></div>
          <div class="cd-ring ring-2"></div>

          <div class="cd-center">
            <div class="cd-hole"></div>
          </div>
        </div>

      </button>

    </div>

  </main>

  <audio
    id="audio"
    src="whereufrom.mp3"
    preload="auto"
  ></audio>

  <script src="script.js"></script>

</body>
</html>
